# Connect to the team's EXISTING MySQL. No Redis, queue broker, PostgreSQL or extra MySQL.
services:
  web:
    build: .
    image: qingliu-web:1.0.0
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: 0.0.0.0:8787
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: "2"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - qingliu_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    cpus: 2
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  qingliu_data:
